<div class="card">
    <div class="header">
        <img src={{image}} alt="">
        <h3>{{title}}</h3>
    </div>
    <div class="links">
        <ng-container *ngFor="let link of links">
            <a target="_blank" href="{{link.link}}">{{link.title}}</a>
        </ng-container>
    </div>
</div>
